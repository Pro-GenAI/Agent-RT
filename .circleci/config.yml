version: 2.1

parameters:
  run_mac_ci:
    type: boolean
    default: false
  run_deps_matrix:
    type: boolean
    default: false
  run_pi_ci:
    type: boolean
    default: false

executors:
  apple_silicon:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium
  # Native Linux arm64 (the Raspberry Pi 3/4/5 ISA). macOS executors have no Docker, so the
  # Pi-limited jobs run here; arm.large has 4 vCPU / 16 GB and the container is capped below it.
  raspberry_pi:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.large
    environment:
      # Pi 4/5 class: 4 cores, 4 GB RAM, no swap beyond RAM.
      PI_DOCKER_LIMITS: --platform linux/arm64 --cpus=4 --memory=4g --memory-swap=4g

commands:
  verify_apple_silicon:
    steps:
      - run:
          name: Verify Apple Silicon runner
          command: |
            set -euo pipefail
            echo "macOS: $(sw_vers -productVersion)"
            echo "arch:  $(uname -m)"
            test "$(uname -m)" = "arm64"

  install_uv:
    steps:
      - run:
          name: Install uv
          command: |
            set -euo pipefail
            if ! command -v uv >/dev/null 2>&1; then
              brew install uv
            fi
            uv --version

  install_nvm:
    steps:
      - run:
          name: Install nvm
          command: |
            set -euo pipefail
            if ! brew list nvm >/dev/null 2>&1; then
              brew install nvm
            fi
            mkdir -p "$HOME/.nvm"
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo 'source "$(brew --prefix nvm)/nvm.sh"'
            } >> "$BASH_ENV"
            source "$(brew --prefix nvm)/nvm.sh"
            nvm --version

jobs:
  python_tests:
    executor: apple_silicon
    steps:
      - checkout
      - verify_apple_silicon
      - install_uv
      - restore_cache:
          keys:
            - uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
            - uv-v1-{{ arch }}-
      - run:
          name: Run Python 3.10-3.14 regression matrix
          command: |
            set -euo pipefail
            cd python
            ./scripts/test-matrix.sh
      - save_cache:
          key: uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
          paths:
            - ~/.cache/uv

  python_browsers:
    executor: apple_silicon
    steps:
      - checkout
      - verify_apple_silicon
      - install_uv
      - restore_cache:
          keys:
            - uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
            - uv-v1-{{ arch }}-
      # Keyed on the Makefile's pinned Playwright version; no prefix fallback, so old browser
      # builds are not restored and re-saved alongside new ones.
      - restore_cache:
          keys:
            - browsers-v2-{{ arch }}-{{ checksum "python/Makefile" }}-{{ checksum "python/scripts/test_browsers.py" }}
      - run:
          name: Run web UI tests in every macOS browser
          command: |
            set -euo pipefail
            cd python
            make test-browsers BROWSER_ARGS="--browsers-dir $HOME/agent-rt-browsers"
      - save_cache:
          key: browsers-v2-{{ arch }}-{{ checksum "python/Makefile" }}-{{ checksum "python/scripts/test_browsers.py" }}
          paths:
            - ~/agent-rt-browsers
      - save_cache:
          key: uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
          paths:
            - ~/.cache/uv

  python_deps_matrix:
    executor: apple_silicon
    steps:
      - checkout
      - verify_apple_silicon
      - install_uv
      - restore_cache:
          keys:
            - uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
            - uv-v1-{{ arch }}-
      - run:
          name: Run Python dependency-version matrix
          command: |
            set -euo pipefail
            cd python
            uv python install 3.12
            make test-deps-matrix
      - save_cache:
          key: uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
          paths:
            - ~/.cache/uv

  python_security:
    executor: apple_silicon
    steps:
      - checkout
      - verify_apple_silicon
      - install_uv
      - restore_cache:
          keys:
            - uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
            - uv-v1-{{ arch }}-
      - run:
          name: Install Python 3.13 dev/security environment
          command: |
            set -euo pipefail
            cd python
            uv python install 3.13
            uv sync --python 3.13 --extra dev --locked
      - run:
          name: Run built-in static security gate
          command: |
            set -euo pipefail
            cd python
            uv run --python 3.13 --extra dev python scripts/security_scan.py --fail-on medium
      - run:
          name: Run offline adversarial security gate
          command: |
            set -euo pipefail
            cd python
            uv run --python 3.13 --extra dev python scripts/security_attack_scan.py
      - run:
          name: Check website CSP hashes, third-party assets, and migration wall
          command: |
            set -euo pipefail
            python3 -m unittest discover -s scripts -p 'test_check_website_csp.py'
            python3 scripts/check_website_csp.py
            python3 scripts/render_migration_wall.py --check
      - run:
          name: Run third-party developer security gate
          command: |
            set -euo pipefail
            cd python
            uv run --python 3.13 --extra dev python scripts/dev_security_scan.py
      - run:
          name: Run Python 3.12 security gate including ModelScan
          command: |
            set -euo pipefail
            cd python
            uv python install 3.12
            uv sync --python 3.12 --extra dev --locked
            uv run --python 3.12 --extra dev python scripts/dev_security_scan.py
      - save_cache:
          key: uv-v1-{{ arch }}-{{ checksum "python/uv.lock" }}
          paths:
            - ~/.cache/uv

  typescript_tests:
    executor: apple_silicon
    steps:
      - checkout
      - verify_apple_silicon
      - install_nvm
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "typescript/package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Run Node 20, 22, 24, and 26 regression matrix
          command: |
            set -euo pipefail
            cd typescript
            ./scripts/test-matrix.sh
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "typescript/package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.nvm/.cache

  typescript_deps_matrix:
    executor: apple_silicon
    steps:
      - checkout
      - verify_apple_silicon
      - install_nvm
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "typescript/package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Install Node 22 and locked dependencies
          command: |
            set -euo pipefail
            nvm install 22 --no-progress
            nvm use 22
            cd typescript
            npm ci
      - run:
          name: Run TypeScript SDK dependency-version matrix
          command: |
            set -euo pipefail
            nvm use 22
            cd typescript
            make test-deps-matrix
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "typescript/package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.nvm/.cache

  typescript_security:
    executor: apple_silicon
    steps:
      - checkout
      - verify_apple_silicon
      - install_nvm
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "typescript/package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Install Node 22 and locked dependencies
          command: |
            set -euo pipefail
            nvm install 22 --no-progress
            nvm use 22
            cd typescript
            npm ci
      - run:
          name: Run TypeScript quality gate
          command: |
            set -euo pipefail
            nvm use 22
            cd typescript
            npm run quality:check
      - run:
          name: Run deterministic TypeScript security gate
          command: |
            set -euo pipefail
            nvm use 22
            cd typescript
            npm run security:gate
      - run:
          name: Run TypeScript AI-agent static security scan
          command: |
            set -euo pipefail
            nvm use 22
            cd typescript
            npm run security:ai:static
      - run:
          name: Generate and validate TypeScript security SBOM
          command: |
            set -euo pipefail
            nvm use 22
            cd typescript
            npm run security:sbom
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "typescript/package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.nvm/.cache

  python_raspberry_pi:
    executor: raspberry_pi
    steps:
      - checkout
      - run:
          name: Run Python tests and security gates in a Raspberry Pi-limited arm64 container (4 CPUs, 4 GB)
          command: |
            set -euo pipefail
            docker run --rm $PI_DOCKER_LIMITS --entrypoint bash \
              -v "$PWD":/work -w /work/python \
              -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_LINK_MODE=copy \
              ghcr.io/astral-sh/uv:python3.12-bookworm -euo pipefail -c '
                test "$(uname -m)" = aarch64
                test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
                uv run --locked --python 3.12 --extra dev \
                  pytest -q -n 4 --dist worksteal -p no:cacheprovider
                uv run --locked --python 3.12 --extra dev \
                  python scripts/security_scan.py --fail-on medium
                uv run --locked --python 3.12 --extra dev \
                  python scripts/security_attack_scan.py
              '

  typescript_raspberry_pi:
    executor: raspberry_pi
    steps:
      - checkout
      - run:
          name: Run TypeScript tests and security gate in a Raspberry Pi-limited arm64 container (4 CPUs, 4 GB)
          command: |
            set -euo pipefail
            docker run --rm $PI_DOCKER_LIMITS \
              -v "$PWD":/work -w /work/typescript \
              node:22-bookworm bash -euo pipefail -c '
                test "$(uname -m)" = aarch64
                test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
                npm ci --omit=optional --ignore-scripts
                npm test
                npm run security:gate
              '

workflows:
  raspberry_pi_ci:
    when: << pipeline.parameters.run_pi_ci >>
    jobs:
      - python_raspberry_pi
      - typescript_raspberry_pi

  apple_silicon_ci:
    when: << pipeline.parameters.run_mac_ci >>
    jobs:
      - python_tests
      - python_browsers
      - python_security
      - typescript_tests
      - typescript_security

  apple_silicon_deps_matrix:
    when: << pipeline.parameters.run_deps_matrix >>
    jobs:
      - python_deps_matrix
      - typescript_deps_matrix
