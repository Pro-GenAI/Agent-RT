[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rt"
version = "0.1.1"
description = "Lightweight utilities for building AI agent harnesses"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "openai>=1.31,<4",
    "httpcore[asyncio]>=1,<2",
    "websockets>=13,<18",
    "requests>=2,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "agent-action-guard[harmactionseval]>=1.2.1,<2; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "onnxruntime<1.24; python_version < '3.11'",
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
openai = ["openai>=1.31,<4"]
anthropic = ["anthropic>=0.29,<2"]
bedrock = ["boto3>=1.34,<2"]
providers = [
    "openai>=1.31,<4",
    "anthropic>=0.29,<2",
]
observability = ["traceloop-sdk>=0.62,<1"]
sandbox-e2b = ["e2b>=1.4,<3"]
sandbox-microsandbox = ["microsandbox>=0.7.4,<0.8"]
sandbox-swe-rex = ["swe-rex>=1.4,<2"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
cli = [
    "prompt-toolkit>=3.0.47,<4",
    "rich>=13.7,<15",
]
web = [
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
]
# Memory packages. "memory" installs the default backend (mem0); the others
# are opt-in and stay out of "all" because each pulls a large dependency tree.
memory = ["mem0ai>=2,<3"]
mem0 = ["mem0ai>=2,<3"]
memu = ["memu-py>=1.5,<2; python_version >= '3.13'"]
zep = ["zep-cloud>=4,<5"]
letta = ["letta-client>=1,<2"]
supermemory = ["supermemory>=5,<6"]
all = [
    "openai>=1.31,<4",
    "anthropic>=0.29,<2",
    "traceloop-sdk>=0.62,<1",
    "e2b>=1.4,<3",
    "microsandbox>=0.7.4,<0.8; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "swe-rex>=1.4,<2",
    "fastapi>=0.115,<1",
    "starlette>=0.37,<2",
    "uvicorn[standard]>=0.30,<1",
    "prompt-toolkit>=3.0.47,<4",
    "rich>=13.7,<15",
]
dev = [
    # Keep this list aligned with the "all" extra.
    "openai>=1.31,<4",
    "anthropic>=0.29,<2",
    "traceloop-sdk>=0.62,<1",
    "e2b>=1.4,<3",
    "microsandbox>=0.7.4,<0.8; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "swe-rex>=1.4,<2",
    "fastapi>=0.115,<1",
    "starlette>=0.37,<2",
    "uvicorn[standard]>=0.30,<1",
    "prompt-toolkit>=3.0.47,<4",
    "rich>=13.7,<15",

    # Development quality/tooling.
    "ruff>=0.13,<1",
    "black>=25.9,<27",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-xdist>=3.6,<4",
    "coverage[toml]>=7,<8",
    "pre-commit>=4,<5",
    "build>=1.2,<2",
    "twine>=6,<7",

    # General application, supply-chain, and secret scanning.
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.10,<3",
    "detect-secrets>=1.5,<2",
    "cyclonedx-bom>=7,<8",

    # AI/LLM, agent/MCP, and model-artifact scanners.
    "agentsec-ai>=0.5,<1",
    "promptfuzz>=0.2,<1",
    "fickling>=0.1.12,<1",
    "picklescan>=1.0.5,<2; python_version >= '3.11'",
    "modelscan>=0.8.8,<1; python_version < '3.13'",
]

[project.scripts]
agent-rt = "agent_rt_cli:main"
artie = "agent_rt_cli:main"

[tool.ruff.lint]
# Deliberate idioms: `import X as X` is the explicit public re-export form,
# runtime boundaries turn any exception into a tool/guardrail result, and
# config validation keeps raising ValueError (callers catch it), and B008
# defaults are all frozen dataclasses (B006 still catches mutable literals).
extend-ignore = ["PLC0414", "BLE001", "TRY004", "B008"]

[tool.ruff.lint.per-file-ignores]
# The public entrypoint and the lazy facade only re-export ext.runtime modules.
"src/agent_rt.py" = ["F401"]
"src/ext/runtime/optional.py" = ["F401"]
# Test fixtures: blocking git setup in async tests and throwaway class attrs.
"tests/**" = ["ASYNC221", "RUF012"]

[[tool.mypy.overrides]]
# Optional integrations without published type information.
module = [
    "agent_action_guard",
    "boto3",
    "botocore.*",
    "docx2txt",
    "letta_client",
    "mem0",
    "memu",
    "pypdf",
    "supermemory",
    "zep_cloud.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent_rt", "agent_rt_api", "agent_rt_cli", "agent_rt_web"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ext", "ext.*"]

[tool.setuptools.package-data]
ext = ["web_ui.html", "debug_ui.html"]


[tool.uv]
# Memory packages pin shared libraries (mem0ai: protobuf<7; memU: numpy).
# Resolve them apart from dev/all so the locked environments keep their own
# versions; pip users can still combine any extras.
conflicts = [
    [{ extra = "memory" }, { extra = "dev" }],
    [{ extra = "memory" }, { extra = "all" }],
    [{ extra = "mem0" }, { extra = "dev" }],
    [{ extra = "mem0" }, { extra = "all" }],
    [{ extra = "memu" }, { extra = "dev" }],
    [{ extra = "memu" }, { extra = "all" }],
    [{ extra = "zep" }, { extra = "dev" }],
    [{ extra = "zep" }, { extra = "all" }],
    [{ extra = "letta" }, { extra = "dev" }],
    [{ extra = "letta" }, { extra = "all" }],
    [{ extra = "supermemory" }, { extra = "dev" }],
    [{ extra = "supermemory" }, { extra = "all" }],
]
