[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rt"
version = "0.0.3"
description = "Lightweight utilities for building AI agent harnesses"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "httpcore[asyncio]>=1,<2",
    "websockets>=14,<17",
    "requests>=2,<3",
    "httpx>=0.27,<1",
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
openai = ["openai>=1,<3"]
anthropic = ["anthropic>=0.40,<1"]
providers = [
    "openai>=1,<3",
    "anthropic>=0.40,<1",
]
observability = ["traceloop-sdk>=0.62,<1"]
guardrails = [
    "agent-action-guard[harmactionseval]>=1.2.1,<2",
    "onnxruntime<1.24; python_version < '3.11'",
]
sandbox-e2b = ["e2b>=1.4,<3"]
sandbox-microsandbox = ["microsandbox>=0.7.4,<0.8"]
sandbox-swe-rex = ["swe-rex>=1.4,<2"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
cli = [
    "agent-action-guard[harmactionseval]>=1.2.1,<2",
    "onnxruntime<1.24; python_version < '3.11'",
    "prompt-toolkit>=3.0.47,<4",
    "rich>=13.7,<15",
]
all = [
    "openai>=1,<3",
    "anthropic>=0.40,<1",
    "traceloop-sdk>=0.62,<1",
    "agent-action-guard[harmactionseval]>=1.2.1,<2; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "onnxruntime<1.24; python_version < '3.11'",
    "e2b>=1.4,<3",
    "microsandbox>=0.7.4,<0.8; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "swe-rex>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "prompt-toolkit>=3.0.47,<4",
    "rich>=13.7,<15",
]
dev = [
    # Keep this list aligned with the "all" extra.
    "openai>=1,<3",
    "anthropic>=0.40,<1",
    "traceloop-sdk>=0.62,<1",
    "agent-action-guard[harmactionseval]>=1.2.1,<2; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "onnxruntime<1.24; python_version < '3.11'",
    "e2b>=1.4,<3",
    "microsandbox>=0.7.4,<0.8; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "swe-rex>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "prompt-toolkit>=3.0.47,<4",
    "rich>=13.7,<15",

    # Development quality/tooling.
    "ruff>=0.13,<1",
    "black>=25.9,<27",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-xdist>=3.6,<4",
    "coverage[toml]>=7,<8",
    "pre-commit>=4,<5",
    "build>=1.2,<2",
    "twine>=6,<7",

    # General application, supply-chain, and secret scanning.
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.10,<3",
    "detect-secrets>=1.5,<2",
    "cyclonedx-bom>=7,<8",

    # AI/LLM, agent/MCP, and model-artifact scanners.
    "agentsec-ai>=0.5,<1",
    "promptfuzz>=0.2,<1",
    "fickling>=0.1.12,<1",
    "picklescan>=1.0.5,<2; python_version >= '3.11'",
    "modelscan>=0.8.8,<1; python_version < '3.13'",
]

[project.scripts]
agent-rt = "agent_rt_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent_rt", "agent_rt_api", "agent_rt_cli"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ext", "ext.*"]

