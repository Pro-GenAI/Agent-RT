:root {
  --bg: #07080c; --rail: #0c0f15; --panel: #10141c; --line: #1d2330; --line-2: #2a3242;
  --text: #eef0f3; --muted: #8b93a1; --acid: #c8ff4d; --mint: #5ef1c4; --amber: #ffc76a;
  --red: #ff6b7a; --code: #0a0d13; --on-acid: #0b0d06;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --sans: Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f1ea; --rail: #e9e6dc; --panel: #fbfaf6; --line: #d9d5c8; --line-2: #c4bfae;
    --text: #15181d; --muted: #5d6470; --acid: #4f7a00; --mint: #0b8a68; --amber: #9a5b00;
    --red: #b3263a; --code: #ece9df; --on-acid: #fbfaf6;
    color-scheme: light;
  }
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
/* Thin, low-contrast scroll bars; the ::-webkit rules cover Safari, which lacks scrollbar-color. */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 3px solid transparent; border-radius: 10px; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); display: grid; grid-template-columns: var(--rail-width, 260px) 1fr; }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acid); outline-offset: 2px; }
.mono { font-family: var(--mono); }

/* rail */
aside { position: relative; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; font: 600 15px var(--mono); letter-spacing: .04em; }

.brand span { color: var(--muted); font-weight: 400; }
.new { margin: 0 14px 12px; padding: 9px 12px; border: 1px dashed var(--line-2); background: none; border-radius: 6px; text-align: left; font-family: var(--mono); font-size: 13px; }
.new:hover { border-color: var(--acid); color: var(--acid); }
.debug-link { padding: 8px 18px; font: 12px var(--mono); color: var(--muted); }
.debug-link:hover { color: var(--acid); }
.label { padding: 6px 18px; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
#sessions { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; }
#sessions li { display: flex; align-items: center; border-radius: 6px; }
#sessions li.on { background: var(--panel); box-shadow: inset 2px 0 var(--acid); }
#sessions .open { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 7px 10px; font: 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sessions .del { background: none; border: 0; color: var(--muted); padding: 4px 9px; opacity: 0; }
#sessions li:hover .del, #sessions .del:focus-visible { opacity: 1; }
@media (hover: none) { #sessions .del { opacity: 1; } }
#sessions .del:hover { color: var(--red); }
.ws { padding: 12px 18px; border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); word-break: break-all; }
.storage-warning { margin: 4px 12px 8px; padding: 8px; font: 11px/1.5 var(--mono); color: var(--amber); border: 1px solid var(--amber); border-radius: 5px; }
.storage-warning[hidden] { display: none; }

/* main */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
#menu { display: none; background: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 10px; }
#sid { font: 13px var(--mono); color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sid b { color: var(--text); font-weight: 500; }
.model { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); }
select { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 8px; font: 13px var(--mono); max-width: 240px; }
#log { flex: 1; overflow-y: auto; padding: 28px 24px 12px; }
.inner { max-width: 820px; margin: 0 auto; }
.empty { margin-top: 12vh; text-align: center; color: var(--muted); }
.empty h1 { display: flex; align-items: center; justify-content: center; gap: 12px; font: 600 28px var(--mono); color: var(--text); margin: 0 0 8px; letter-spacing: -.01em; }
.empty h1 i { width: 40px; height: 40px; }
.empty h1 em { font-style: normal; color: var(--acid); }
.turn { padding: 10px 0; }
.turn + .turn { margin-top: 6px; }
/* The speaker is shown by layout (your messages on the right); the label stays for screen readers. */
.who { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.user .col { display: flex; flex-direction: column; align-items: flex-end; }
.user .body { max-width: min(80%, 620px); padding: 9px 15px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px 18px 4px 18px; color: var(--text); white-space: pre-wrap; }
.body { min-width: 0; overflow-wrap: anywhere; }
.body .part { display: contents; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body p { margin: 0 0 .7em; }
.body h3 { font-size: 16px; margin: 1em 0 .4em; }
.body ul, .body ol { margin: 0 0 .7em; padding-left: 1.3em; }
.body code { font: 13px var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.body pre { background: var(--code); border: 1px solid var(--line); border-left: 2px solid var(--mint); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .8em; }
.body pre code { border: 0; padding: 0; background: none; }
.body a { color: var(--mint); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tools span { font: 11px var(--mono); color: var(--mint); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 7px; }
.tools span::before { content: "⚙ "; }
.note { font: 12px var(--mono); color: var(--amber); margin-top: 6px; }
.err { color: var(--red); }
.cursor::after { content: "▍"; color: var(--acid); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.approval { border: 1px solid var(--amber); border-radius: 8px; padding: 12px 14px; margin: 8px 0; background: var(--panel); }
.approval h4 { margin: 0 0 6px; font: 600 12px var(--mono); color: var(--amber); text-transform: uppercase; letter-spacing: .1em; }

.btn { border: 1px solid var(--line-2); background: none; border-radius: 6px; padding: 6px 12px; font: 13px var(--mono); }
.btn.go { background: var(--acid); color: var(--on-acid); border-color: var(--acid); }
.btn:hover { border-color: var(--acid); }

/* composer */

.box { max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 10px 10px 14px; }
.box:focus-within { border-color: var(--muted); }
/* The box border already shows focus; the global :focus-visible outline would add a lime ring. */
.box textarea:focus-visible { outline: none; }
.box b { font: 600 14px/26px var(--mono); color: var(--acid); }
textarea { flex: 1; resize: none; border: 0; background: none; outline: none; max-height: 220px; line-height: 26px; padding: 0; }
#send { background: var(--acid); color: var(--on-acid); border: 0; border-radius: 7px; padding: 6px 14px; font: 600 13px var(--mono); }
#send.stop { background: none; color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.hint { max-width: 820px; margin: 6px auto 0; font: 11px var(--mono); color: var(--muted); }

#resize { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 2; touch-action: none; }
#resize:hover, #resize.drag { background: linear-gradient(var(--line-2), var(--line-2)) center / 2px 100% no-repeat; }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  #resize { display: none; }
  aside { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
  body.rail aside { transform: none; }

<body>

  <div class="ws" id="ws"></div>
  <div id="resize" role="separator" aria-orientation="vertical" aria-label="Resize sessions panel" aria-valuemin="180" aria-valuemax="480" aria-valuenow="260" tabindex="0"></div>
</aside>
<main>
  <header>
    <button id="menu" type="button" aria-label="Show sessions" aria-controls="rail">☰</button>
    <div id="sid"></div>
    <label class="model">model <select id="model"></select></label>
  </header>

  <form id="form">
    <div class="box">

  </form>
</main>
<script nonce="__AGENT_RT_NONCE__">
"use strict";
const $ = (id) => document.getElementById(id);
const turns = $("turns"), log = $("log"), input = $("input"), send = $("send");
let info = null, current = null, busy = false, controller = null;

// Sessions live only in this browser (IndexedDB, falling back to memory), never on the server.
const memory = new Map();
let temporaryStorage = false;
function useTemporaryStorage() {
  if (temporaryStorage) return;
  temporaryStorage = true;

  warning.textContent = "Temporary storage: conversations may be lost when you reload or close this page.";
  warning.hidden = false;
}
// "meta" holds only list fields, so drawing the session list never loads whole transcripts.
const metaOf = (s) => ({ id: s.id, workspace: s.workspace, title: s.title, updated: s.updated });
const dbp = new Promise((resolve, reject) => {
  const req = indexedDB.open("agent-rt", 2);
  req.onupgradeneeded = (e) => {
    const db = req.result;
    if (e.oldVersion < 1) db.createObjectStore("sessions", { keyPath: "id" });
    if (e.oldVersion < 2) {

      if (e.oldVersion >= 1) {

async function withStorage(operation, fallback) {

// Tells other tabs a session changed so their lists and transcripts stay current.
const channel = "BroadcastChannel" in window ? new BroadcastChannel("agent-rt") : null;
const announce = (id) => channel && channel.postMessage(id);

function newSession() {
  const id = crypto.randomUUID().replace(/-/g, "").slice(0, 12);
  return { id, workspace: info.workspace, title: "", model: info.model, autoApprove: false, messages: [], updated: Date.now() };
}
function shown(messages) {
  return messages
    .filter((m) => m.role === "user" || m.role === "assistant")
    .map((m) => ({
      role: m.role,
      text: m.content.filter((p) => p.type === "text" && p.text).map((p) => p.text).join(""),
      tools: (m.tool_calls || []).map((c) => c.name),

    .filter((m) => m.text || m.tools.length);
}

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "content-type": "application/json", "x-agent-rt": "1", ...(options.headers || {}) } });
  if (!res.ok) {

    try { msg = (await res.json()).detail || msg; } catch (_) {}

  }

function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

// Small Markdown subset; everything is escaped first, so model output cannot inject HTML.
function inline(s) {

    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")

function md(text) {
  const out = [];
  const parts = esc(text).split(/^```[^\n]*\n?/m);
  parts.forEach((chunk, i) => {
    if (i % 2) { out.push("<pre><code>" + chunk.replace(/\n$/, "") + "</code></pre>"); return; }
    for (const block of chunk.split(/\n{2,}/)) {
      const lines = block.split("\n").filter((l) => l.trim());
      if (!lines.length) continue;
      if (lines.every((l) => /^\s*([-*]|\d+\.)\s/.test(l))) {
        const items = lines.map((l) => "<li>" + inline(l.replace(/^\s*([-*]|\d+\.)\s/, "")) + "</li>").join("");
        // Keep the model's numbering: blank lines between items split one list into several blocks.
        const n = /^\s*(\d+)\./.exec(lines[0]);
        out.push(n ? '<ol start="' + Number(n[1]) + '">' + items + "</ol>" : "<ul>" + items + "</ul>");
      } else if (/^#{1,6}\s/.test(lines[0]) && lines.length === 1) {
        out.push("<h3>" + inline(lines[0].replace(/^#+\s/, "")) + "</h3>");
      } else {

      }
    }

// End of the last finished block (a blank line outside a code fence) after `from`.
function blockEnd(text, from) {
  const re = /^```|\n\n/gm;
  re.lastIndex = from;
  let cut = from, fences = 0;
  for (let m; (m = re.exec(text)); ) {
    if (m[0] === "```") fences++;
    else if (fences % 2 === 0) cut = m.index + 2;
  }

}
// Scan each character once. Hold back two bytes to recognize markers split over chunks.
function newBlockScanner() {

    const re = /^```|\n\n/gm;
    re.lastIndex = scanned;
    const limit = final ? text.length : Math.max(0, text.length - 2);
    for (let m; (m = re.exec(text)); ) {
      if (m.index >= limit) break;
      if (m[0] === "```") fences++;

    }
    scanned = Math.max(scanned, limit);
    return cut;
  };
}
const LIVE_MARKDOWN_LIMIT = 4096;

function turn(role) {

  el.className = "turn " + role;
  el.innerHTML = '<div class="who"></div><div class="col"><div class="tools"></div><div class="body"></div></div>';
  el.querySelector(".who").textContent = role === "user" ? "you" : "agent";

}

  span.textContent = name;

}
const scroll = () => { log.scrollTop = log.scrollHeight; };

function renderEmpty() {
  turns.innerHTML = '<div class="empty"><h1><i></i><span>agent-rt<em>_</em></span></h1><div>Chat with your agent about the code in this folder.</div></div>';
}

async function render() {
  await renderRail();
  renderTurns();
}
async function renderRail() {

  $("sid").innerHTML = "<b></b>";
  $("sid").querySelector("b").textContent = current.title || "new session";
  $("ws").textContent = info.workspace;

  $("model").replaceChildren(...models.map((m) => new Option(m, m, false, m === current.model)));

    .filter((s) => s.workspace === info.workspace)
    .sort((a, b) => b.updated - a.updated);

  list.replaceChildren();

    li.className = s.id === current.id ? "on" : "";
    const open = document.createElement("button");
    open.className = "open"; open.type = "button"; open.textContent = open.title = s.title || "untitled";

function renderTurns() {

  for (const m of messages) {
    // Tool-call steps and the final answer of one run share a single agent turn.
    const el = m.role === "assistant" && last && last.classList.contains("assistant") ? last : turn(m.role);

async function act(fn) {

  try { await fn(); await render(); } catch (e) { flash(e.message); }

}

function flash(msg) {
  const el = turn("assistant");
  el.querySelector(".body").innerHTML = '<span class="err"></span>';
  el.querySelector(".err").textContent = "error: " + msg;
  scroll();
}

function approvalCard(el, a) {
  const card = document.createElement("div");
  card.className = "approval";
  card.innerHTML = '<h4>edit needs approval</h4><div class="path"></div>';
  card.querySelector(".path").textContent = a.action + " → " + a.path;
  for (const [k, v] of Object.entries(a.details)) {

          // A tool call ends this step's text; keep the next step's text in its own block.

    if (signal.aborted) note("stopped", "note"); else note("error: " + e.message, "note err");

    body.classList.remove("cursor");
    el.querySelectorAll(".approval .row").forEach((row) => row.remove());

    send.textContent = "run ↵"; send.classList.remove("stop"); send.removeAttribute("aria-label");
    log.removeAttribute("aria-busy");

      // Redraw the transcript only if another tab added turns while this one waited.
      if (failed || session !== current || !stale) await renderRail();
      else {
        await render();
        const col = [...turns.querySelectorAll(".turn.assistant .col")].pop();
        for (const [msg, cls] of notes.filter(([m]) => !m.startsWith("waiting"))) {
          const n = document.createElement("div"); n.className = cls; n.textContent = msg;
          if (col) col.appendChild(n);
        }

  }
}

$("form").onsubmit = (e) => {

  input.value = ""; grow();

  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
};

input.oninput = grow;
$("new").onclick = () => act(async () => { current = newSession(); });
$("model").onchange = (e) => act(async () => {
  current.model = e.target.value;
  if (current.messages.length) { current.updated = Date.now(); await store.put(current); announce(current.id); }

// Sidebar width: drag the edge or use the arrow keys; remembered in this browser only.
const RAIL_KEY = "agent-rt-rail-width", resize = $("resize");

}
try { const saved = Number(localStorage.getItem(RAIL_KEY)); if (saved) setRailWidth(saved, false); } catch (_) {}
const railWidth = () => $("rail").getBoundingClientRect().width;
resize.onpointerdown = (e) => {
  e.preventDefault(); // no text selection while dragging
  resize.setPointerCapture(e.pointerId);
  resize.classList.add("drag");
  resize.onpointermove = (m) => setRailWidth(m.clientX, false);
  resize.onpointerup = resize.onpointercancel = () => {
    resize.onpointermove = resize.onpointerup = resize.onpointercancel = null;
    resize.classList.remove("drag");
    setRailWidth(railWidth(), true);
  };
};
resize.onkeydown = (e) => {
  const step = { ArrowLeft: -16, ArrowRight: 16 }[e.key];
  if (step) { e.preventDefault(); setRailWidth(railWidth() + step, true); }
};
$("menu").onclick = () => document.body.classList.toggle("rail");
// On a phone the open drawer covers the menu button and there is no Escape key, so a tap beside it closes it.
document.querySelector("main").addEventListener("click", (e) => { if (!e.target.closest("#menu")) document.body.classList.remove("rail"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.body.classList.remove("rail"); });
if (channel) channel.onmessage = async (e) => {
  if (busy) return;
  if (e.data === current.id) {
    const latest = await store.get(current.id);
    current = latest || newSession();
    await render();
  } else {
    await renderRail();
  }
};

(async () => {
  info = await (await api("/api/info")).json();
  const id = decodeURIComponent(location.hash.slice(1));
  const saved = id && (await store.get(id));
  // A link to another workspace's session opens a new one: its history belongs to that folder.
  current = saved && saved.workspace === info.workspace ? saved : newSession();
  await render();
  // Each endpoint's /v1/models arrives after the page is usable; add them to the menu then.
  api("/api/models").then((r) => r.json()).then((d) => { info.models = d.models; return renderRail(); }).catch(() => {});
})().catch((e) => flash(e.message));
input.focus();
</script>
</body>
</html>
