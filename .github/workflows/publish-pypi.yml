name: Publish Python Package to PyPI

on:
  release:
    types: [created]

jobs:
  publish-pypi:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-rt

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        working-directory: python
        run: python -m build

      - name: Check distributions
        working-directory: python
        run: twine check dist/*

      - name: Test built wheel in clean environment
        working-directory: python
        run: |
          python -m venv /tmp/pkg-test
          /tmp/pkg-test/bin/python -m pip install --upgrade pip
          wheel=$(ls dist/*.whl)
          # The test suite exercises the optional API server and terminal client.
          /tmp/pkg-test/bin/python -m pip install "${wheel}[api,cli]"
          /tmp/pkg-test/bin/python -m pip install pytest pytest-asyncio
          cd /tmp
          /tmp/pkg-test/bin/python -m pytest "$GITHUB_WORKSPACE/python/tests"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: python/dist
          verbose: true
