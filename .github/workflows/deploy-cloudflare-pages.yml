name: Deploy website to Cloudflare Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate website Content Security Policy
        run: python3 scripts/check_website_csp.py

      - name: Deploy to existing agent-rt Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4cb4b7634d713a251f8a85c536db41d5
          command: pages deploy docs/website --project-name=agent-rt
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
